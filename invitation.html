<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820">
<title>Darem Amin | Birthday Details</title><link rel="stylesheet" href="style.css">
</head>
<body class="invite-page">
<main class="poster invite-poster" aria-label="Darem Amin birthday invitation details">
  <img class="art" src="page2-invitation.gif" alt="Darem Amin birthday invitation details">
  <a class="hotspot location" href="https://www.google.com/maps/search/?api=1&query=The+Riverside+Lounge+Ismailia+Egypt" target="_blank" rel="noopener" aria-label="Open venue location in Google Maps" title="Location"></a>
  <a class="hotspot rsvp" href="https://wa.me/?text=Hi%2C%20I%27d%20like%20to%20RSVP%20for%20Darem%20Amin%27s%20birthday%20celebration%20on%2018%20August.%20Please%20count%20me%20in." target="_blank" rel="noopener" aria-label="RSVP via WhatsApp" title="RSVP"></a>
  <a class="hotspot photos" href="https://www.google.com/search?q=Darem+Amin+birthday+party+photos" target="_blank" rel="noopener" aria-label="Search for party photos" title="Photos"></a>
  <a class="hotspot video" href="https://www.youtube.com/results?search_query=Darem+Amin+birthday+party+video" target="_blank" rel="noopener" aria-label="Search for party videos on YouTube" title="Video"></a>
  <button class="hotspot note" id="open-note" type="button" aria-label="Leave a sweet note" title="Leave a sweet note"></button>
  <a class="hotspot back" href="index.html" aria-label="Back to cover" title="Back to cover"></a>
</main>
<div class="note-modal" id="note-modal" hidden>
  <section class="note-card" role="dialog" aria-modal="true" aria-labelledby="note-heading">
    <button class="close-note" id="close-note" type="button" aria-label="Close">×</button>
    <div class="card-topline"><span class="tiny-heart">♥</span><span class="crown-mark" aria-hidden="true">♛</span><span class="tiny-heart">♥</span></div>
    <div class="gold-heart" aria-hidden="true">♥</div>
    <p class="eyebrow">A LITTLE WISH, FROM THE HEART</p>
    <h1 id="note-heading">A Sweet Wish for <em>Daroumi</em></h1>
    <div class="ornament-divider" aria-hidden="true"><span>♥</span></div>
    <p class="sweet-message">May all your sweet dreams<br>be real soon ..</p>
    <p class="love-message">Love you Daroumi <span>♥</span></p>
    <div class="wax-seal" aria-hidden="true">♛</div>
    <button class="gold-button" id="continue-note" type="button">Leave your message <span aria-hidden="true">↗</span></button>
    <form id="note-form" hidden>
      <label for="guest-message">Write a little something for Daroumi</label>
      <textarea id="guest-message" rows="4" maxlength="1000" placeholder="Write your message here…" required></textarea>
      <button class="gold-button" type="submit"><span aria-hidden="true">➤</span> Send to WhatsApp</button>
      <p class="small-help">Your note will open in WhatsApp, ready for you to send.</p>
    </form>
  </section>
</div>
<script>
(() => {
 const modal = document.getElementById('note-modal');
 const continueButton = document.getElementById('continue-note');
 const form = document.getElementById('note-form');
 const message = document.getElementById('guest-message');
 const closeButton = document.getElementById('close-note');
 document.getElementById('open-note').addEventListener('click', () => { modal.hidden = false; document.body.classList.add('modal-open'); continueButton.focus(); });
 closeButton.addEventListener('click', closeModal);
 modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
 document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });
 continueButton.addEventListener('click', () => { continueButton.hidden = true; form.hidden = false; message.focus(); });
 function closeModal(){ modal.hidden = true; document.body.classList.remove('modal-open'); continueButton.hidden = false; form.hidden = true; form.reset(); }
 form.addEventListener('submit', e => {
   e.preventDefault();
   const text = 'A sweet note for Darem Amin 🎂\n\n' + message.value.trim() + '\n\nMay all your sweet dreams be real soon .. Love you Daroumi ♥️';
   const url = 'https://wa.me/?text=' + encodeURIComponent(text);
   window.open(url, '_blank', 'noopener,noreferrer');
 });
})();
</script>
</body></html>
